# Effective Stage 2 SFT setting specification.
# Stage 2 resumes the released Stage 1 adapter; both released adapter
# configurations record LoRA dropout at 0.2.
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
adapter_name_or_path: models/stage1
image_max_pixels: 262144
trust_remote_code: true
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
lora_dropout: 0.2
dataset_dir: training_data
dataset: stage2_relation_evidence_aligned_v1_train84x10_cycle
eval_dataset: stage2_relation_evidence_aligned_v1_val12_frozen
template: qwen2_vl
cutoff_len: 4096
output_dir: outputs/stage2
logging_steps: 10
save_steps: 100
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-6
weight_decay: 0.05
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
seed: 42
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
load_best_model_at_end: false
