# Effective Stage 1 SFT setting specification.
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 262144
trust_remote_code: true
use_fast_tokenizer: false
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
lora_dropout: 0.2
dataset_dir: training_data
dataset: stage1_relation_evidence_aligned_v1_grounding_train84x10,stage1_paper_corrected_v6_paragraph_events_v1_train84x10_runtime_exact_262144,dimao_text_completion_papers_v6_final,dimao_text_classification_machine_repaired_v1
eval_dataset: stage1_paper_corrected_v6_paragraph_events_v1_val12_runtime_exact_262144_frozen
template: qwen2_vl
cutoff_len: 2048
mix_strategy: concat
output_dir: outputs/stage1
logging_steps: 10
save_steps: 100
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
weight_decay: 0.05
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
seed: 42
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
load_best_model_at_end: false
